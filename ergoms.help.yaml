# Source of truth (ru). Translations: locales/<lang>/ergoms.help.yaml
module: ai_assistant
title: AI-ассистент
summary: Чат и RAG-справка по функционалу сайта для пользователей
commands:
  sync-knowledge:
    summary: Проиндексировать справку по разделам сайта (меню, UI, пакеты knowledge/) в RAG
  install-pgvector:
    summary: Установить файлы pgvector в portable PostgreSQL и создать расширение vector в текущей БД
  ensure-pgvector:
    summary: Проверить и создать расширение pgvector в текущей БД
notes:
  - 'Вызов: ergoms ai_assistant:sync-knowledge [--sync]'
  - 'В setup-full: после migrate (include_in setup-full-after-migrate, с --sync)'
  - 'Ежедневно: Celery Beat (RAG_SYSTEM_CORPUS_BEAT_ENABLED; нужны start-beat и start-worker)'
  - 'Корпус: меню, свой UI и пакеты knowledge/ в media_api, не обход чужих modules/'
  - 'Свой пакет: ergoms publish-knowledge-packs --module=ai_assistant; hook: api/user_guides/*.md и user_description'
  - 'Векторный RAG: ergoms ai_assistant:install-pgvector, затем ergoms ai_assistant:ensure-pgvector'
  - 'Нужны Ollama и модель embeddings (OLLAMA_EMBEDDINGS_MODEL; setup-full: ollama_models.yaml → pull-setup-models)'
  - 'Эквивалент: ergoms api sync_system_knowledge'
  - 'Корпус для пользователей сайта, не документация разработчика'
