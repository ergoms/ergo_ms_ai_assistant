# Source of truth (ru). Translations: locales/<lang>/ergoms.help.yaml
module: ai_assistant
title: AI-ассистент
summary: Чат и RAG-справка по функционалу сайта для пользователей
commands:
  sync-knowledge:
    summary: Проиндексировать справку по разделам сайта (меню, UI, модули) в RAG
  install-pgvector:
    summary: Установить расширение pgvector в portable PostgreSQL для векторного RAG
  ensure-pgvector:
    summary: Проверить и создать расширение pgvector в текущей БД
notes:
  - 'Вызов: ergoms ai_assistant:sync-knowledge'
  - 'Векторный RAG: ergoms ai_assistant:install-pgvector, затем ergoms ai_assistant:ensure-pgvector'
  - 'Нужны Ollama и модель embeddings (OLLAMA_EMBEDDINGS_MODEL; setup-full: ollama_models.yaml → pull-setup-models)'
  - 'Эквивалент: ergoms api sync_system_knowledge'
  - 'Корпус для пользователей сайта, не документация разработчика'
