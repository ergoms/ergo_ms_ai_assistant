# Учёт процессов API/worker/beat модуля в ergoms resource-usage.
module: ai_assistant
roles:
  - id: module-api:ai_assistant
    when:
      - cmdline_contains_any:
          - start_module_api.py
        project_bound: true
  - id: module-worker:ai_assistant
    when:
      - cmdline_contains_any:
          - --hostname=worker@ai_assistant
        project_bound: true
  - id: module-beat:ai_assistant
    when:
      - cmdline_contains_any:
          - celerybeat-schedule-ai_assistant
        project_bound: true
