# Задачи VS Code / setup-full для ai_assistant
# Discovery: module_tasks_loader → ModuleSetupTasksStep / ModuleSetupTasksAfterMigrateStep

module: ai_assistant
tasks:
  - label: "AI Assistant: Install pgvector"
    detail: "Установить расширение pgvector в portable PostgreSQL для векторного RAG"
    command: "ergoms ai_assistant:install-pgvector"
    hide: true
    order: 0
    include_in:
      - setup-full

  - label: "AI Assistant: Publish knowledge packs"
    detail: "Опубликовать пакет справки модуля в media_api до синхронизации RAG"
    command: "ergoms publish-knowledge-packs --module=ai_assistant"
    hide: true
    order: 15
    include_in:
      - setup-full-after-migrate

  - label: "AI Assistant: Sync knowledge"
    detail: "Синхронизировать пользовательский корпус RAG (меню, UI, пакеты knowledge/) после миграций"
    command: "ergoms ai_assistant:sync-knowledge --sync"
    hide: true
    order: 20
    include_in:
      - setup-full-after-migrate
