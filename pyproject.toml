[tool.poetry]
name = "ai_assistant"
version = "0.1.0"
description = "AI assistant module with RAG pipeline, document parsing, and skill execution"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
python-docx = ">=1.2.0,<2.0.0"
reportlab = ">=4.4.2,<5.0.0"
pypdf2 = "^3.0.1"
pdfplumber = "^0.11.8"
sympy = "^1.14.0"
rank-bm25 = ">=0.2.2"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"
