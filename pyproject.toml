[tool.poetry]
name = "ai_assistant"
version = "0.1.0"
description = "AI assistant module with RAG pipeline, document parsing, and skill execution"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
python-docx = ">=1.2.0,<2.0.0"
reportlab = ">=4.4.2,<5.0.0"
pypdf2 = "^3.0.1"
pdfplumber = "^0.11.8"
sympy = "^1.14.0"
pgvector = ">=0.3.6,<0.4.0"
chonkie = ">=1.5.0,<2.0.0"
# TableChef (CSV/Excel): pandas + openpyxl + tabulate (extras chonkie[table] installer не раскрывает)
pandas = ">=2.0.0,<4.0.0"
openpyxl = ">=3.1.0,<4.0.0"
tabulate = ">=0.9.0,<1.0.0"

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"
